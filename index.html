<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">

  <title>Cổng Thông Tin Nghiệp Vụ</title>

  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, minimum-scale=1.0">

  <!-- Giao diện chuẩn phong cách Vue của Docsify -->
  <link rel="stylesheet"
        href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">

  <!-- CSS cho Dark / Light Mode -->
  <link rel="stylesheet"
        href="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/style.min.css">

</head>

<body>

  <div id="app">Đang tải dữ liệu hệ thống...</div>

  <script>

    window.$docsify = {

      // Tên website
      name: 'Cổng Tri Thức & Nghiệp Vụ',

      repo: '',

      // Kích hoạt thanh menu bên trái
      loadSidebar: true,

      // Tự động lấy tiêu đề trang đưa vào menu
      subMaxLevel: 3,

      // Kích hoạt tìm kiếm toàn trang
      search: 'auto',

      // =========================
      // DARK / LIGHT MODE
      // =========================
      darklightTheme: {

        // Font của website
        siteFont: 'PT Sans',

        // Chế độ mặc định khi mở website
        defaultTheme: 'light',

        // Font cho code
        codeFontFamily: 'Roboto Mono, Monaco, courier, monospace',

        // Cỡ chữ
        bodyFontSize: '15px'
      }

    }

  </script>


  <!-- =========================
       DOCSIFY
       ========================= -->

  <!-- Thư viện mã nguồn mở Docsify -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>


  <!-- =========================
       SEARCH
       ========================= -->

  <!-- Plugin tìm kiếm thông minh -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>


  <!-- =========================
       COPY CODE
       ========================= -->

  <!-- Plugin Copy Code -->
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>


  <!-- =========================
       COUNT & READING TIME
       ========================= -->

  <!-- Plugin Đếm số chữ & Thời gian đọc -->
  <script src="//cdn.jsdelivr.net/npm/docsify-count/dist/countable.min.js"></script>


  <!-- =========================
       DARK / LIGHT MODE
       ========================= -->

  <!-- Plugin Dark / Light Mode -->
  <script src="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/index.min.js"></script>

</body>

</html>
