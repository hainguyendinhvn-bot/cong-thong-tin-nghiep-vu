<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">

  <title>Cổng Thông Tin Nghiệp Vụ</title>

  <meta
    http-equiv="X-UA-Compatible"
    content="IE=edge,chrome=1"
  >

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Cổng Thông Tin Nghiệp Vụ Nội Bộ"
  >

  <!-- Docsify -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css"
  >

  <!-- Dark / Light Mode -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/style.min.css"
  >

  <style>

    /* =========================
       GLOBAL
       ========================= */

    body {
      font-family: "Segoe UI", Arial, sans-serif;
    }

    /* =========================
       SIDEBAR
       ========================= */

    .sidebar {
      border-right: 1px solid #e5e7eb;
    }

    .sidebar-nav > ul > li > strong {
      display: block;
      margin-top: 18px;
      margin-bottom: 8px;
      font-size: 13px;
      letter-spacing: .3px;
    }

    .sidebar-nav li a {
      transition: all .2s ease;
    }

    .sidebar-nav li a:hover {
      transform: translateX(3px);
    }

    /* =========================
       CONTENT
       ========================= */

    .markdown-section {
      max-width: 1000px;
    }

    .markdown-section h1 {
      font-weight: 700;
    }

    .markdown-section h2 {
      margin-top: 35px;
    }

    .markdown-section table {
      display: table;
      width: 100%;
    }

    .markdown-section blockquote {
      border-radius: 6px;
    }

    /* =========================
       SEARCH
       ========================= */

    .search .search-keyword {
      font-weight: 600;
    }

    /* =========================
       MOBILE
       ========================= */

    @media screen and (max-width: 768px) {

      .markdown-section {
        padding: 20px;
      }

      .markdown-section table {
        display: block;
        overflow-x: auto;
      }

    }

  </style>

</head>

<body>

  <div id="app">
    Đang tải dữ liệu hệ thống...
  </div>

  <script>

    window.$docsify = {

      /* =========================
         WEBSITE
         ========================= */

      name: 'Cổng Thông Tin Nghiệp Vụ',

      repo: '',

      homepage: 'README.md',

      loadSidebar: true,

      subMaxLevel: 3,

      /* =========================
         ROUTER
         ========================= */

      routerMode: 'hash',

      /* =========================
         SEARCH
         ========================= */

      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Tìm kiếm...',
        noData: 'Không tìm thấy kết quả.',
        depth: 3
      },

      /* =========================
         DARK / LIGHT
         ========================= */

      darklightTheme: {

        siteFont: 'Segoe UI',

        defaultTheme: 'light',

        codeFontFamily:
          'Consolas, Monaco, monospace',

        bodyFontSize: '15px'
      },

      /* =========================
         COPY CODE
         ========================= */

      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied!'
      },

      /* =========================
         NOT FOUND
         ========================= */

      notFoundPage: true,

      notFoundPage: '404.md'

    };

  </script>

  <!-- Docsify -->
  <script
    src="https://cdn.jsdelivr.net/npm/docsify@4">
  </script>

  <!-- Search -->
  <script
    src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js">
  </script>

  <!-- Copy Code -->
  <script
    src="https://cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js">
  </script>

  <!-- Count -->
  <script
    src="https://cdn.jsdelivr.net/npm/docsify-count/dist/countable.min.js">
  </script>

  <!-- Dark / Light -->
  <script
    src="https://cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/index.min.js">
  </script>

</body>

</html>
